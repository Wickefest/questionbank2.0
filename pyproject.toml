[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "questbank"
version = "0.1.0"
description = "Phase 1 Chemistry Paper 1 MCQ ingestion parser"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24.0",
  "pydantic>=2.10.0",
  "docling>=2.14.0",
  "rapidocr-onnxruntime>=1.3.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]
vision = [
  "google-generativeai>=0.8.0",
]

[project.scripts]
parse-chemistry-paper-1 = "questbank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:xonsh"
